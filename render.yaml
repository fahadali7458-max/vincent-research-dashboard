services:
  - type: web
    name: vincent-research-platform
    runtime: node
    plan: free
    region: singapore
    buildCommand: git lfs pull || true; npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/stats
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
